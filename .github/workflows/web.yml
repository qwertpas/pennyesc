name: Browser checks
on:
  push:
    paths: ['docs/**', 'web-tests/**', 'firmware/Lib/**', 'firmware/tools/tests/test_bridge.py', '.github/workflows/web.yml']
  pull_request:
    paths: ['docs/**', 'web-tests/**', 'firmware/Lib/**', 'firmware/tools/tests/test_bridge.py', '.github/workflows/web.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python3.11 -m unittest discover -s firmware/tools/tests -p test_bridge.py
